name: Build and publish UI bundle

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Rebuild image-optimization binaries
        run: npm rebuild gifsicle optipng-bin

      - name: Build UI bundle
        run: node_modules/.bin/gulp bundle

      - name: Publish as the "latest" release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: latest
          name: Latest UI bundle
          prerelease: true
          body: Automatically published from the latest commit on main. Not a versioned release -- this tag is overwritten on every push.
          files: build/ui-bundle.zip
